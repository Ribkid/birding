<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sarah's BirdyDex</title>
    <meta
      name="description"
      content="Sarah's collectable field guide to the birds, native animals and plants of South East Queensland: log sightings, identify calls and photos, earn badges."
    />
    <!-- Both schemes, so the browser's own first canvas is already dark on a dark phone, never a white flash. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F4F6F9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0E12" media="(prefers-color-scheme: dark)" />
    <script>
      // The theme she chose in Settings, before the first paint (theme.ts keeps this copy of it).
      try { var theme = localStorage.getItem('birddex-theme'); if (theme && theme !== 'auto') document.documentElement.setAttribute('data-theme', theme); } catch (e) {}
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <link rel="preload" href="/fonts/schibsted-grotesk-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/schibsted-grotesk-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/big-shoulders-display-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/caprasimo-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!--
      The shell: what the app looks like before React has run, painted with the app's own stylesheet as soon as the
      page loads (v1 had its tab bar in the page too). React's first draw replaces all of it, in the same places.
      On the Dex it is the hero (the wordmark over the deep colour, the empty count capsule and the sheet's edge);
      on any other screen just the paper. The tab bar is TabBar's markup exactly: src/__tests__/shell.test.tsx keeps
      the two the same, so a change to TabBar must be made here too.
    -->
    <div id="root">
      <main id="view" tabindex="-1" data-shell>
        <header class="dex-hero kind--bird">
          <div class="dex-hero-photo" aria-hidden="true"></div>
          <div class="dex-hero-top">
            <span></span>
            <div class="dex-hero-actions" aria-hidden="true">
              <span class="hero-btn glass"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="2"></circle><path d="M15 15l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg></span>
              <span class="hero-btn glass"><svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor"><path d="M12 6V2.6M16.2 7.8l2.4-2.4M18 12h3.4M16.2 16.2l2.4 2.4M12 18v3.4M7.8 16.2l-2.4 2.4M6 12H2.6M7.8 7.8L5.4 5.4" stroke-width="3.4"></path><circle cx="12" cy="12" r="6.6" stroke-width="2.2"></circle><circle cx="12" cy="12" r="2.4" stroke-width="2"></circle></g></svg></span>
            </div>
          </div>
          <div class="dex-hero-foot">
            <h1 class="wordmark">Sarah's BirdyDex<small>South East Queensland</small></h1>
            <p class="dex-cap glass" aria-hidden="true"><svg class="ring dex-cap-ring ring--zero" viewBox="0 0 36 36"><circle class="ring-track" cx="18" cy="18" r="15"></circle></svg><span class="shell-ghost"><b>00</b> of 291 animals seen</span></p>
          </div>
        </header>
        <div class="dex-sheet"></div>
      </main>
      <nav class="tabbar" aria-label="Main"><a data-tab="dex" aria-current="page" href="#/dex" data-discover="true"><span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect></svg></span><span class="tab-label">Dex</span></a><a data-tab="learn" aria-current="false" href="#/learn" data-discover="true"><span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7.5h11a1.5 1.5 0 0 1 1.5 1.5v10a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 19V9A1.5 1.5 0 0 1 7 7.5zM8.5 4.5h10A1.5 1.5 0 0 1 20 6v10"></path></svg></span><span class="tab-label">Learn</span></a><a href="#/add" id="plus" class="tab-plus" aria-label="Add a sighting" aria-current="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a><a data-tab="map" aria-current="false" href="#/map" data-discover="true"><span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg></span><span class="tab-label">Map</span></a><a data-tab="me" id="me-tab" aria-label="Me, not signed in" aria-current="false" href="#/me" data-discover="true"><span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="4"></circle><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"></path></svg><i class="tab-dot" aria-hidden="true"></i></span><span class="tab-label">Me</span></a></nav>
    </div>
    <script>
      // The tab that owns the address is the current one (TabBar's TAB_FOR); only the Dex keeps the hero.
      (function (s) { var t = /^(learn|quiz)$/.test(s) ? 'learn' : s === 'map' ? 'map' : /^(me|u|lists?|patch|targets|outing|log|stats|badges|settings|leaderboard)$/.test(s) ? 'me' : 'dex';
        document.querySelectorAll('#root [data-tab]').forEach(function (a) { a.setAttribute('aria-current', a.getAttribute('data-tab') === t ? 'page' : 'false'); });
        if (s !== 'dex') document.querySelector('#root [data-shell]').textContent = ''; })(location.hash.split(/[/?]/)[1] || 'dex');
    </script>
    <noscript><p style="padding: 24px">BirdyDex needs JavaScript turned on.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
