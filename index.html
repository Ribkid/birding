<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sarah's BirdyDex</title>
  <meta name="description" content="Sarah's collectable field guide to the birds, native animals and plants of South East Queensland: log sightings, identify calls and photos, earn badges.">
  <meta name="theme-color" content="#EDF1EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1E1B" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- Every module app.js imports, and the species lists species.js waits for, are asked for at once instead of
       level by level (on one bar of signal each level otherwise waits for the one before). Keep in step with the imports. -->
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/species.js">
  <link rel="modulepreload" href="js/gallery.js">
  <link rel="modulepreload" href="js/db.js">
  <link rel="modulepreload" href="js/media.js">
  <link rel="modulepreload" href="js/stats.js">
  <link rel="modulepreload" href="js/ebird.js">
  <link rel="modulepreload" href="js/seqdata.js">
  <link rel="modulepreload" href="js/card3d.js">
  <link rel="modulepreload" href="js/learn.js">
  <link rel="modulepreload" href="js/quiz.js">
  <link rel="modulepreload" href="js/statsview.js">
  <link rel="modulepreload" href="js/scan.js">
  <link rel="modulepreload" href="js/mapinfo.js">
  <link rel="modulepreload" href="js/account.js">
  <link rel="modulepreload" href="js/cloud.js">
  <link rel="modulepreload" href="js/config.js">
  <link rel="modulepreload" href="js/sync.js">
  <link rel="modulepreload" href="js/motion.js">
  <link rel="modulepreload" href="js/layers.js">
  <link rel="modulepreload" href="js/look.js">
  <link rel="preload" href="data/species-new.json" as="fetch" crossorigin>
  <link rel="preload" href="data/tiers.json" as="fetch" crossorigin>
  <link rel="preload" href="fonts/schibsted-grotesk-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/big-shoulders-display-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/caprasimo-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/field.css">
  <link rel="stylesheet" href="css/learn.css">
  <link rel="stylesheet" href="css/calls.css">
  <link rel="stylesheet" href="css/scan.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/look.css">
  <link rel="stylesheet" href="css/screens.css">
</head>
<body>
  <main id="view" tabindex="-1"></main>
  <div id="outing-bar" class="outing-bar" hidden></div>
  <div id="announce" class="sr-only" role="status" aria-live="polite"></div>
  <nav class="tabbar" aria-label="Main">
    <a href="#/dex" data-tab="dex">
      <span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg></span>
      <span>Dex</span></a>
    <a href="#/lists" data-tab="lists">
      <span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg></span>
      <span>Lists</span></a>
    <a href="#/add" id="plus" class="tab-plus" aria-label="Add a sighting">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
    <a href="#/map" data-tab="map">
      <span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>
      <span>Map</span></a>
    <a href="#/badges" data-tab="badges">
      <span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="5.5"/><path d="M8.5 13.5L7 21l5-2.5 5 2.5-1.5-7.5"/></svg></span>
      <span>Badges</span></a>
  </nav>
  <noscript><p style="padding:24px">BirdyDex needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
